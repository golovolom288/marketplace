{% load static %}
<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Registration</title>
  <link href="{% static 'css/normalize.css' %}" rel="stylesheet" type="text/css" />
  <link href="{% static 'css/registration.css' %}" rel="stylesheet" type="text/css" />
</head>

<body>

  <div class="registration_content">
    <h1>Registration</h1>
    <form class="form_content" action="{% url 'registration' %}" method="post">
      {% csrf_token %}
      {{form.username}}
      {{form.email}}
      {{form.country}}
      {{form.password1}}
      {{form.password2}}
      {% if form.errors %}
            <label>{{form.errors}}</label>
      {%endif%}
      <a href="{% url 'login'%}">Do you have an account?</a>
      <button type="submit">Registration</button>
    </form>
    
  </div>
  
  <script src="script.js"></script>
</body>
</html>
